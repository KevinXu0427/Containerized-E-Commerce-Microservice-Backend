# RabbitMQ: rabbitmq:3-management — ports 5672 (AMQP), 15672 (management UI)
# If pull hangs: docker pull rabbitmq:3-management
# If "name already in use": docker rm -f <container>
# If .erlang.cookie eacces: docker compose down -v then up again (reset volume)

services:

  rabbitmq:
    image: rabbitmq:3-management
    # Omit container_name to avoid clashing with other projects using name "rabbitmq"
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 50s

  customerservice:
    container_name: customerservice
    build:
      context: ./CustomerService/CustomerService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./CustomerService/CustomerService.Api/Data:/app/Data

  productservice:
    container_name: productservice
    build:
      context: ./ProductService/ProductService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./ProductService/ProductService.Api/Data:/app/Data

  inventoryservice:
    container_name: inventoryservice
    restart: on-failure:3
    build:
      context: ./InventoryService/InventoryService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./InventoryService/InventoryService.Api/Data:/app/Data
    depends_on:
      rabbitmq:
        condition: service_healthy

  orderservice:
    container_name: orderservice
    restart: on-failure:3
    build:
      context: ./OrderService/OrderService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
      RABBITMQ_HOST: rabbitmq
      CustomerServiceUrl: http://customerservice:8080
      ProductServiceUrl: http://productservice:8080/
      InventoryServiceUrl: http://inventoryservice:8080/
    volumes:
      - ./OrderService/OrderService.Api/Data:/app/Data
    depends_on:
      rabbitmq:
        condition: service_healthy
      customerservice:
        condition: service_started
      productservice:
        condition: service_started
      inventoryservice:
        condition: service_started

  apigateway:
    container_name: apigateway
    build:
      context: ./ApiGateway/ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      orderservice:
        condition: service_started
      customerservice:
        condition: service_started
      productservice:
        condition: service_started
      inventoryservice:
        condition: service_started

volumes:
  rabbitmq_data:
